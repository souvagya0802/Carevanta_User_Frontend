<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Carevanta</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #eef4ff; color: #0b1b3a; }
    main { max-width: 360px; padding: 32px 24px; text-align: center; }
    img { width: 56px; height: 56px; border-radius: 5px; }
    h1 { font-size: 18px; margin: 16px 0 6px; }
    p { color: #4b5563; font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
    button { height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #1e6cff; color: #fff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="" />
    <h1>You are offline</h1>
    <p>Doctors, slots and orders need a live connection so nothing is shown out of date. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
